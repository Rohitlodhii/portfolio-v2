<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom YouTube Player Example</title>
  <style>
    /* Reset & Page Base */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f0f11;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    h1 {
      margin-bottom: 24px;
      font-weight: 500;
      font-size: 1.5rem;
      letter-spacing: -0.025em;
      color: #e4e4e7;
    }

    /* Player Container */
    .player-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      background: #000000;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    /* 
      YouTube API Cropping Wrapper:
      We make the iframe larger than the container (e.g. 116% width/height) 
      and offset it negatively (e.g. -8% top/left). Because the parent (.player-container)
      has `overflow: hidden`, the top title bar and bottom branding are pushed 
      outside the visible area, effectively cropping them out.
    */
    .iframe-wrapper {
      position: absolute;
      width: 116%;
      height: 116%;
      top: -8%;
      left: -8%;
      z-index: 0;
      pointer-events: none; /* Block direct iframe clicks */
    }
    .iframe-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* 
      Interactive Click Overlay:
      Sits on top of the iframe to capture clicks (play/pause) and prevent
      YouTube hover titles/cards from being clickable.
    */
    .click-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      cursor: pointer;
    }

    /* Large Centered Play/Pause Toggle Indicator */
    .play-overlay-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      width: 72px;
      height: 72px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      z-index: 11;
    }
    .play-overlay-btn svg {
      width: 32px;
      height: 32px;
      fill: currentColor;
    }
    .player-container.paused .play-overlay-btn {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* Loader/Buffering Spinner */
    .loader-overlay {
      position: absolute;
      inset: 0;
      z-index: 12;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .loader-overlay.active {
      opacity: 1;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-left-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Controls Bar */
    .controls-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
      padding: 24px;
      padding-top: 64px;
      background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.7) 40%, rgba(0,0,0,0) 100%);
      display: flex;
      flex-direction: column;
      gap: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      transform: translateY(10px);
    }
    /* Show controls on hover or keyboard focus */
    .player-container:hover .controls-bar,
    .player-container.paused .controls-bar,
    .player-container:focus-within .controls-bar {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    /* Timeline Container */
    .timeline-container {
      position: relative;
      width: 100%;
      height: 12px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }
    .timeline-track {
      position: absolute;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      transition: height 0.15s;
    }
    .timeline-fill {
      position: absolute;
      left: 0;
      height: 100%;
      background: #ffffff;
      border-radius: 2px;
      width: 0%;
    }
    .timeline-container:hover .timeline-track {
      height: 6px;
    }
    /* Invisible slider input overlaid for native interactions */
    .timeline-slider {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      z-index: 5;
    }

    /* Control Row Buttons & Inputs */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .controls-group {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.05);
    }
    .btn:active {
      transform: scale(0.95);
    }
    .btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Time Display */
    .time-display {
      font-size: 0.875rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.8);
      font-variant-numeric: tabular-nums;
    }
    .time-separator {
      margin: 0 4px;
      color: rgba(255, 255, 255, 0.4);
    }

    /* Volume Container */
    .volume-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .volume-slider-wrapper {
      width: 0;
      opacity: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      transition: width 0.3s ease, opacity 0.3s ease;
    }
    .volume-container:hover .volume-slider-wrapper,
    .volume-container:focus-within .volume-slider-wrapper {
      width: 80px;
      opacity: 1;
    }
    .volume-slider {
      width: 80px;
      height: 4px;
      appearance: none;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    .volume-slider::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .volume-slider::-webkit-slider-thumb:hover {
      transform: scale(1.3);
    }
  </style>
</head>
<body>

  <h1>Custom YouTube Player</h1>

  <div class="player-container paused" id="player-container">
    <!-- YouTube API Frame (replaced dynamically by API) -->
    <div class="iframe-wrapper">
      <div id="yt-player"></div>
    </div>

    <!-- Clicking Overlay -->
    <div class="click-overlay" id="click-overlay"></div>

    <!-- Central Play Overlay Button -->
    <div class="play-overlay-btn">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </div>

    <!-- Buffer Spinner -->
    <div class="loader-overlay" id="loader-overlay">
      <div class="spinner"></div>
    </div>

    <!-- Controls Overlay -->
    <div class="controls-bar">
      <!-- Timeline Track -->
      <div class="timeline-container">
        <div class="timeline-track">
          <div class="timeline-fill" id="timeline-fill"></div>
        </div>
        <input class="timeline-slider" type="range" id="timeline-slider" min="0" max="100" value="0">
      </div>

      <!-- Controls Row -->
      <div class="controls-row">
        <!-- Left Section (Play, Time) -->
        <div class="controls-group">
          <button class="btn" id="play-btn" aria-label="Play">
            <!-- Play Icon -->
            <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <!-- Pause Icon (hidden initially) -->
            <svg id="pause-icon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>

          <div class="time-display">
            <span id="current-time">0:00</span>
            <span class="time-separator">/</span>
            <span id="duration-time">0:00</span>
          </div>
        </div>

        <!-- Right Section (Volume, Fullscreen) -->
        <div class="controls-group">
          <div class="volume-container">
            <button class="btn" id="mute-btn" aria-label="Mute">
              <svg id="volume-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
              <svg id="mute-icon" viewBox="0 0 24 24" style="display:none;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.21.05-.42.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
            </button>
            <div class="volume-slider-wrapper">
              <input class="volume-slider" type="range" id="volume-slider" min="0" max="100" value="100">
            </div>
          </div>

          <button class="btn" id="fullscreen-btn" aria-label="Fullscreen">
            <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 1. Load YouTube IFrame API script tag asynchronously
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    // YouTube Video Configurations
    const VIDEO_ID = 'dQw4w9WgXcQ'; // Rick Astley - Never Gonna Give You Up (Placeholder)

    let player;
    let isSeeking = false;
    let updateInterval;

    // DOM Elements
    const playerContainer = document.getElementById('player-container');
    const clickOverlay = document.getElementById('click-overlay');
    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const pauseIcon = document.getElementById('pause-icon');
    const currentTimeEl = document.getElementById('current-time');
    const durationTimeEl = document.getElementById('duration-time');
    const timelineSlider = document.getElementById('timeline-slider');
    const timelineFill = document.getElementById('timeline-fill');
    const muteBtn = document.getElementById('mute-btn');
    const volumeIcon = document.getElementById('volume-icon');
    const muteIcon = document.getElementById('mute-icon');
    const volumeSlider = document.getElementById('volume-slider');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const loaderOverlay = document.getElementById('loader-overlay');

    // 2. This callback is executed when the YouTube IFrame API is fully ready
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-player', {
        videoId: VIDEO_ID,
        playerVars: {
          autoplay: 0,
          controls: 0,        // Hides YouTube controls
          rel: 0,             // Disables related videos recommendations at end
          showinfo: 0,        // Hides video title/author (deprecated but good practice)
          modestbranding: 1,  // Hides larger YouTube logo in control bar
          disablekb: 1,       // Hides keyboard controls to prevent double triggers
          fs: 0,              // Hides YouTube native fullscreen button
          iv_load_policy: 3,  // Hides video annotations
          playsinline: 1      // Allows inline playback on iOS browsers
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    // 3. Triggered once the player is ready and initialized
    function onPlayerReady(event) {
      // Sync initial state
      durationTimeEl.textContent = formatTime(player.getDuration());
      timelineSlider.max = player.getDuration();
      
      // Update UI interactions
      setupEventListeners();
    }

    // 4. Listens for player state updates to keep controls synchronized
    function onPlayerStateChange(event) {
      // States: -1=unstarted, 0=ended, 1=playing, 2=paused, 3=buffering, 5=video cued
      const state = event.data;

      // Handle Buffering state
      if (state === 3) {
        loaderOverlay.classList.add('active');
      } else {
        loaderOverlay.classList.remove('active');
      }

      // Handle Play/Pause toggling UI
      if (state === 1) {
        setIsPlaying(true);
        startTimeTracker();
      } else {
        setIsPlaying(false);
        stopTimeTracker();
      }

      // Reset on ended
      if (state === 0) {
        player.seekTo(0);
        player.pauseVideo();
        updateProgressBar(0);
      }
    }

    function setIsPlaying(playing) {
      if (playing) {
        playerContainer.classList.remove('paused');
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
      } else {
        playerContainer.classList.add('paused');
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
      }
    }

    // 5. Setup interaction event listeners
    function setupEventListeners() {
      // Play/Pause toggles
      playBtn.addEventListener('click', togglePlay);
      clickOverlay.addEventListener('click', togglePlay);

      // Seek / Timeline dragging
      timelineSlider.addEventListener('input', handleTimelineInput);
      timelineSlider.addEventListener('mousedown', () => isSeeking = true);
      timelineSlider.addEventListener('mouseup', handleSeekEnd);
      timelineSlider.addEventListener('touchstart', () => isSeeking = true);
      timelineSlider.addEventListener('touchend', handleSeekEnd);

      // Volume Controls
      volumeSlider.addEventListener('input', handleVolumeSlider);
      muteBtn.addEventListener('click', toggleMute);

      // Fullscreen Controls
      fullscreenBtn.addEventListener('click', toggleFullscreen);
      clickOverlay.addEventListener('dblclick', toggleFullscreen);

      // Sync window fullscreen state change (like Esc key exit)
      document.addEventListener('fullscreenchange', () => {
        const isFS = !!document.fullscreenElement;
        fullscreenBtn.innerHTML = isFS 
          ? '<svg viewBox="0 0 24 24"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>' // Minimize
          : '<svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>'; // Maximize
      });
    }

    function togglePlay() {
      if (player.getPlayerState() === 1) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    }

    // 6. Smooth timeline progress bar updates
    function startTimeTracker() {
      stopTimeTracker();
      updateInterval = setInterval(() => {
        if (!isSeeking) {
          const current = player.getCurrentTime();
          updateProgressBar(current);
        }
      }, 100);
    }

    function stopTimeTracker() {
      clearInterval(updateInterval);
    }

    function updateProgressBar(seconds) {
      currentTimeEl.textContent = formatTime(seconds);
      timelineSlider.value = seconds;
      
      const duration = player.getDuration();
      const pct = duration > 0 ? (seconds / duration) * 100 : 0;
      timelineFill.style.width = pct + '%';
    }

    function handleTimelineInput(e) {
      const time = parseFloat(e.target.value);
      updateProgressBar(time);
    }

    function handleSeekEnd(e) {
      isSeeking = false;
      const time = parseFloat(timelineSlider.value);
      player.seekTo(time, true);
    }

    // 7. Volume and mute triggers
    function handleVolumeSlider(e) {
      const vol = parseInt(e.target.value);
      player.setVolume(vol);
      
      if (vol === 0) {
        player.mute();
        setMuteUI(true);
      } else {
        player.unmute();
        setMuteUI(false);
      }
    }

    function toggleMute() {
      if (player.isMuted()) {
        player.unmute();
        setMuteUI(false);
        const prevVol = volumeSlider.value > 0 ? volumeSlider.value : 50;
        player.setVolume(prevVol);
        volumeSlider.value = prevVol;
      } else {
        player.mute();
        setMuteUI(true);
        volumeSlider.value = 0;
      }
    }

    function setMuteUI(muted) {
      if (muted) {
        volumeIcon.style.display = 'none';
        muteIcon.style.display = 'block';
      } else {
        volumeIcon.style.display = 'block';
        muteIcon.style.display = 'none';
      }
    }

    // 8. Custom Fullscreen logic on player wrapper
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        playerContainer.requestFullscreen().catch(err => {
          console.error("Fullscreen Request Failed:", err);
        });
      } else {
        document.exitFullscreen();
      }
    }

    // 9. Time Formatter Helper (MM:SS)
    function formatTime(timeInSeconds) {
      if (isNaN(timeInSeconds) || timeInSeconds === Infinity) return "0:00";
      const m = Math.floor(timeInSeconds / 60);
      const s = Math.floor(timeInSeconds % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }
  </script>
</body>
</html>
